<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周末交友战术指挥舱 v7.6 — 地图容错 + 无效字段降噪 + 视觉聚焦</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
/* ============================================================
   周末交友战术指挥舱 v7.6
   A区: Master-Detail + 联系方式视觉统治 + 零重复
   B区: 大地图 + 编号图钉 + 待定地点容错跳过
   C区: C4冲突/看板/气象(80/10/10) + C2/C3/C5甘特图
   三区联动 | 三色硬隔离 | 无效字段灰化降噪
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0a0e14;
  --surface: #111820;
  --surface2: #1a2230;
  --border: #252d3a;
  --text: #e0e6f0;
  --muted: #6b7280;
  --accent: #60a5fa;
  --danger: #f43f5e;
  --success: #22c55e;
  --gold: #f59e0b;
  --radius: 10px;
  --radius-sm: 6px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --transition: 0.2s ease;
  /* 新增颜色 */
  --next-week-bg: rgba(59,130,246,0.08);
  --next-week-border: rgba(96,165,250,0.35);
  --weekday-bg: rgba(34,197,94,0.08);
  --weekday-border: rgba(34,197,94,0.35);
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh; width: 100vw;
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* ===== 顶部栏 ===== */
.header {
  height: 44px; min-height: 44px;
  background: var(--surface);
  border-bottom:1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
  z-index: 1000; flex-shrink: 0;
}
.header h1 { font-size: 14px; font-weight: 600; letter-spacing: 1px; white-space: nowrap; }
.header .h-badge {
  font-size: 10px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 2px 8px; color: var(--muted);
}
.header .h-origin {
  margin-left: auto; font-size: 11px; color: var(--gold);
  display: flex; align-items: center; gap: 5px;
}
.h-origin .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); display: inline-block; }

/* ===== 主布局 ===== */
.main {
  display: flex; flex: 1; overflow: hidden;
}

/* ─────── A区 ─────── */
.zone-a {
  width: 50%; min-width: 0;
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border);
  background: var(--bg);
}

/* ── 筛选 Tab 栏 ── */
.filter-bar {
  display: flex; flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  flex: 1; padding: 8px 0; font-size: 12px; font-weight: 500;
  border: none; background: transparent; color: var(--muted);
  cursor: pointer; transition: all var(--transition);
  border-bottom: 2px solid transparent;
  font-family: var(--font); position: relative;
}
.filter-btn:hover { color: var(--text); background: var(--surface2); }
.filter-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.filter-btn .fc-badge {
  position: absolute; top: 2px; right: 6px; font-size: 9px;
  background: var(--surface2); border-radius: 8px; padding: 0 5px;
  line-height: 14px; color: var(--muted);
}
.filter-btn.active .fc-badge { background: rgba(96,165,250,0.15); color: var(--accent); }

/* ── 统计通栏 ── */
.stats-ribbon {
  height: 5%; min-height: 38px; max-height: 48px;
  flex-shrink: 0;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 12px; gap: 16px;
  overflow: hidden;
}
.stats-ribbon .sr-item { display: flex; align-items: center; gap: 4px; font-size: 11px; white-space: nowrap; }
.sr-item .sr-val { font-weight: 600; font-size: 13px; }
.sr-item .sr-lbl { color: var(--muted); font-size: 10px; }
.sr-divider { width: 1px; height: 18px; background: var(--border); }
.sr-bar-wrap { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 0; }
.sr-bar-wrap .sr-bar-lbl { font-size: 10px; white-space: nowrap; flex-shrink: 0; }
.sr-bar-track {
  height: 6px; width: 100%; max-width: 180px;
  background: var(--surface2); border-radius: 3px; overflow: hidden;
  display: flex;
}
.sr-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.sr-bar-fill.cold { background: linear-gradient(90deg, #1e3a5f, #3b82f6); }
.sr-bar-fill.warm { background: linear-gradient(90deg, #92400e, #f59e0b); }

/* ── A区 Master-Detail 主体 ── */
.zone-a-body {
  flex: 1; display: flex; overflow: hidden;
  min-height: 0;
}
.zone-a-body.global-mode .a-detail { display: none; }
.zone-a-body.global-mode .a-list { width: 100%; }
.zone-a-body.day-mode .a-detail { display: flex; width: 50%; }
.zone-a-body.day-mode .a-list { width: 50%; }

/* ── A区 Detail 详情面板 ── */
.a-detail {
  display: none; flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow: hidden;
}
.a-detail-scroll {
  flex: 1; overflow-y: auto; padding: 16px 18px 24px;
}
.a-detail-scroll::-webkit-scrollbar { width: 4px; }
.a-detail-scroll::-webkit-scrollbar-track { background: transparent; }
.a-detail-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ad-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); gap: 12px;
}
.ad-placeholder .ad-ph-icon { font-size: 48px; opacity: 0.4; }
.ad-placeholder .ad-ph-text { font-size: 13px; letter-spacing: 1px; }

.ad-header {
  display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px;
}
.ad-gid-badge {
  flex-shrink: 0; width: 48px; height: 54px;
  background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #1d4ed8 100%);
  clip-path: polygon(50% 0%, 100% 0%, 100% 78%, 50% 100%, 0% 78%, 0% 0%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 12px rgba(37,99,235,0.5);
  border: 1.5px solid rgba(255,255,255,0.3);
}
.ad-gid-badge .ad-gid-num {
  font-size: 20px; font-weight: 800; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5); line-height: 1; margin-top: -2px;
}
.ad-title-group { flex: 1; min-width: 0; }
.ad-title {
  font-size: 20px; font-weight: 700; line-height: 1.3; color: #fff;
  margin-bottom: 6px; letter-spacing: 0.5px;
}
.ad-tone-tag {
  display: inline-block; font-size: 10px; padding: 3px 12px; border-radius: 10px;
  font-weight: 500; letter-spacing: 0.5px;
}
.ad-tone-tag.cold { background: rgba(30,58,138,0.7); border: 1px solid rgba(59,130,246,0.5); color: #93c5fd; }
.ad-tone-tag.warm { background: rgba(146,64,14,0.7); border: 1px solid rgba(245,158,11,0.5); color: #fcd34d; }
.ad-tone-tag.neutral { background: rgba(55,65,81,0.7); border: 1px solid rgba(156,163,175,0.5); color: #d1d5db; }
.ad-tone-tag.next-week { background: rgba(59,130,246,0.7); border: 1px solid rgba(96,165,250,0.5); color: #93c5fd; }
.ad-tone-tag.weekday { background: rgba(34,197,94,0.7); border: 1px solid rgba(34,197,94,0.5); color: #86efac; }

.ad-section { margin-bottom: 18px; }
.ad-section-title {
  font-size: 10px; font-weight: 500; color: var(--muted);
  text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.ad-info-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px;
}
.ad-info-item { display: flex; flex-direction: column; gap: 2px; }
.ad-info-lbl { font-size: 9px; color: var(--muted); letter-spacing: 0.5px; }
.ad-info-val { font-size: 14px; font-weight: 500; color: #fff; }
.ad-info-val.large { font-size: 18px; font-weight: 700; }

/* ── 紧凑摘要条（替代重复的基础信息网格）── */
.ad-compact-strip {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  padding: 8px 12px; margin-bottom: 16px;
  background: rgba(255,255,255,0.03);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(255,255,255,0.05);
  font-size: 10px;
}
.ad-compact-strip .ad-cs-item {
  display: flex; align-items: center; gap: 4px;
  color: rgba(255,255,255,0.45);
}
.ad-compact-strip .ad-cs-val {
  color: rgba(255,255,255,0.65); font-weight: 500;
}
/* 联系方式与摘要之间的强分割线 */
.ad-divider-strong {
  width: 100%; height: 2px;
  background: linear-gradient(90deg, rgba(245,158,11,0.5) 0%, transparent 70%);
  margin: 8px 0 14px; border: none;
}

/* ── 联系方式高亮区（全新升级：超大字号 + 金色辉光）── */
.ad-contact-highlight {
  padding: 18px 20px; background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(10,14,20,0.95) 100%);
  border-radius: var(--radius); border: 2px solid var(--gold);
  margin-bottom: 18px; position: relative; overflow: hidden;
}
.ad-contact-highlight::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 20% 0%, rgba(245,158,11,0.15) 0%, transparent 70%);
  z-index: 0; pointer-events: none;
}
.ad-contact-highlight .ad-ch-label {
  position: relative; z-index: 1;
  font-size: 10px; color: var(--gold); letter-spacing: 3px;
  text-transform: uppercase; margin-bottom: 14px;
  font-weight: 700;
}
.ad-contact-highlight .ad-ch-row {
  display: flex; align-items: flex-start; gap: 14px; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: relative; z-index: 1;
}
.ad-contact-highlight .ad-ch-row:last-child { border-bottom: none; }
.ad-contact-highlight .ad-ch-icon {
  font-size: 22px; flex-shrink: 0; width: 30px; text-align: center;
  margin-top: 4px;
}
.ad-contact-highlight .ad-ch-val {
  font-size: 36px; font-weight: 900; color: #fbbf24;
  letter-spacing: 2px; word-break: break-all;
  line-height: 1.2;
  text-shadow: 0 0 24px rgba(245,158,11,0.5), 0 2px 4px rgba(0,0,0,0.6);
}
.ad-contact-highlight .ad-ch-val.wechat-val {
  font-size: 38px;
  background: linear-gradient(180deg, #fbbf24 0%, #f59e0b 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 12px rgba(245,158,11,0.6));
}
.ad-contact-highlight .ad-ch-val.phone-val {
  font-size: 34px;
  color: #fcd34d;
  text-shadow: 0 0 20px rgba(245,158,11,0.5), 0 2px 4px rgba(0,0,0,0.5);
}
.ad-contact-highlight .ad-ch-val.small { font-size: 18px; color: #fff; text-shadow: none; }
.ad-contact-highlight .ad-ch-sub {
  font-size: 11px; color: var(--muted); margin-bottom: 4px;
  letter-spacing: 1px; font-weight: 500;
}

/* 二维码展示（独立渲染在左侧）*/
.ad-qr-container {
  display: flex; justify-content: center; margin-top: 16px;
  position: relative; z-index: 1;
  padding: 10px; background: rgba(255,255,255,0.03);
  border-radius: var(--radius); border: 1px dashed rgba(245,158,11,0.3);
}
.ad-qr-container img {
  max-width: 200px; max-height: 200px;
  border-radius: var(--radius-sm);
  border: 3px solid rgba(245,158,11,0.4);
  background: #fff; padding: 6px;
  box-shadow: 0 0 20px rgba(245,158,11,0.25);
}

.ad-essence {
  font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.75);
  padding: 12px 14px; background: var(--surface2); border-radius: var(--radius);
  border-left: 3px solid var(--accent);
}
.ad-full-text {
  font-size: 13px; line-height: 1.9; color: rgba(255,255,255,0.82);
  padding: 14px 16px; background: var(--surface2); border-radius: var(--radius);
  border-left: 3px solid var(--gold);
  white-space: pre-wrap; word-break: break-word;
  max-height: 360px; overflow-y: auto;
}
.ad-full-text::-webkit-scrollbar { width: 4px; }
.ad-full-text::-webkit-scrollbar-track { background: transparent; }
.ad-full-text::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.ad-core {
  font-size: 12px; line-height: 1.6; color: rgba(255,255,255,0.7);
  padding: 10px 14px; background: var(--surface2); border-radius: var(--radius);
}
.ad-link {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--accent); text-decoration: none;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: background var(--transition);
}
.ad-link:hover { background: var(--surface2); }

/* ── A区 List ── */
.a-list { overflow: hidden; display: flex; flex-direction: column; }
.a-list .gallery-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 10px; scroll-behavior: smooth; }
.a-list .gallery-scroll::-webkit-scrollbar { width: 4px; }
.a-list .gallery-scroll::-webkit-scrollbar-track { background: transparent; }
.a-list .gallery-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 8px;
}
.gallery-grid.single-col { grid-template-columns: 1fr; }

/* ── 海报卡片 ── */
.poster-card {
  border-radius: var(--radius);
  overflow: hidden; position: relative;
  min-height: 260px; cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
  border: 2px solid var(--border);
  display: flex; flex-direction: column; justify-content: flex-end;
}
.poster-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 1; }
.poster-card.selected { border-color: var(--accent) !important; box-shadow: 0 0 16px rgba(96,165,250,0.4) !important; }

/* 卡片色彩区分 — 硬隔离 */
.poster-card.next-week {
  background: rgba(59,130,246,0.16) !important;
  border-color: rgba(96,165,250,0.55) !important;
  border-style: dashed !important;
  border-width: 2px !important;
}
.poster-card.weekday {
  background: rgba(34,197,94,0.16) !important;
  border-color: rgba(34,197,94,0.55) !important;
  border-style: dashed !important;
  border-width: 2px !important;
}
.poster-card.next-week:hover {
  border-color: rgba(96,165,250,0.85) !important;
  background: rgba(59,130,246,0.24) !important;
}
.poster-card.weekday:hover {
  border-color: rgba(34,197,94,0.8) !important;
  background: rgba(34,197,94,0.24) !important;
}
/* 周末卡片保持实线 */
.poster-card:not(.next-week):not(.weekday) {
  border-style: solid;
}

/* Global ID 徽章 */
.global-id-badge {
  position: absolute; z-index: 10; top: 10px; left: 10px;
  width: 34px; height: 38px;
  background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 50%, #1d4ed8 100%);
  clip-path: polygon(50% 0%, 100% 0%, 100% 78%, 50% 100%, 0% 78%, 0% 0%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(37,99,235,0.5);
  border: 1.5px solid rgba(255,255,255,0.3);
}
.global-id-badge .gid-num {
  font-size: 15px; font-weight: 800; color: #fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  line-height: 1; margin-top: -2px;
}

.poster-bg {
  position: absolute; inset: 0; z-index: 0;
  background-size: cover; background-position: center;
  transition: transform 0.4s ease;
}
.poster-card:hover .poster-bg { transform: scale(1.04); }

.poster-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(
    180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 30%,
    rgba(0,0,0,0.65) 70%, rgba(0,0,0,0.92) 100%
  );
}

.poster-content {
  position: relative; z-index: 2;
  padding: 16px 14px 14px;
  color: #fff; display: flex; flex-direction: column; gap: 8px;
}

.poster-tone {
  position: absolute; z-index: 3; top: 12px; right: 12px;
  font-size: 10px; padding: 3px 10px; border-radius: 10px;
  font-weight: 500; backdrop-filter: blur(6px);
  letter-spacing: 0.5px;
}
.poster-tone.tone-cold { background: rgba(30,58,138,0.7); border: 1px solid rgba(59,130,246,0.5); color: #93c5fd; }
.poster-tone.tone-warm { background: rgba(146,64,14,0.7); border: 1px solid rgba(245,158,11,0.5); color: #fcd34d; }
.poster-tone.tone-neutral { background: rgba(55,65,81,0.7); border: 1px solid rgba(156,163,175,0.5); color: #d1d5db; }
.poster-tone.tone-next { background: rgba(37,99,235,0.7); border: 1px solid rgba(96,165,250,0.5); color: #93c5fd; }
.poster-tone.tone-wkd { background: rgba(22,163,74,0.7); border: 1px solid rgba(34,197,94,0.5); color: #86efac; }

.poster-name {
  font-size: 16px; font-weight: 600; line-height: 1.3;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  letter-spacing: 0.5px; padding-left: 40px;
}
.poster-meta {
  display: grid; grid-template-columns: 1fr 1fr; gap: 3px 12px;
  font-size: 11px; opacity: 0.9;
}
.poster-meta .pm-item { display: flex; gap: 3px; }
.poster-meta .pm-lbl { opacity: 0.55; font-size: 10px; }
.poster-meta .pm-val { font-weight: 500; }
.poster-meta .pm-val.pm-dimmed { opacity: 0.45; color: var(--muted); font-weight: 400; }

.poster-details { display: flex; flex-direction: column; gap: 2px; }
.poster-detail-row {
  display: flex; align-items: flex-start; gap: 5px;
  font-size: 10.5px; line-height:1.4; padding: 4px 7px;
  border-radius: 4px; background: rgba(255,255,255,0.06);
  backdrop-filter: blur(2px);
}
.poster-detail-icon { flex-shrink: 0; font-size: 11px; }
.poster-detail-text { flex: 1; opacity: 0.85; }

.poster-essence {
  font-size: 10.5px; line-height: 1.5; opacity: 0.6;
  max-height: 40px; overflow: hidden;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

.poster-footer {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;
}
.poster-link { color: rgba(255,255,255,0.6); text-decoration: none; }
.poster-link:hover { color: #fff; }
.poster-score { font-weight: 600; font-size: 12px; }
.poster-score.high { color: var(--success); }
.poster-score.mid { color: var(--gold); }
.poster-score.low { color: var(--danger); }

/* ── 高亮态 ── */
@keyframes highlight-pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(96,165,250,0.7); }
  50% { box-shadow: 0 0 0 10px rgba(96,165,250,0); }
}
.highlight-active {
  border-color: var(--accent) !important;
  animation: highlight-pulse 1.2s ease-in-out infinite !important;
  z-index: 20 !important;
}
.poster-card.highlight-active {
  box-shadow: 0 0 24px rgba(96,165,250,0.5), 0 8px 24px rgba(0,0,0,0.5) !important;
}

/* ─────── B/C区 ─────── */
.zone-bc {
  width: 50%; min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
}

.zone-b {
  height: 50%; flex-shrink: 0;
  position: relative;
  border-bottom: 1px solid var(--border);
}
#map { width: 100%; height: 100%; }

.map-legend {
  position: absolute; bottom: 8px; left: 8px; z-index: 1000;
  background: rgba(10,14,20,0.92); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 10px;
  font-size: 9px; display: flex; flex-direction: column; gap: 3px;
  backdrop-filter: blur(6px);
}
.map-legend .li { display: flex; align-items: center; gap: 5px; color: var(--muted); }
.map-legend .ld { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.map-marker-highlight {
  filter: drop-shadow(0 0 8px rgba(96,165,250,0.9)) !important;
}

/* ─────── C区 ─────── */
.zone-c {
  height: 50%; flex-shrink: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

/* ── C4 面板 (上 66.6%) ── */
.c4-panel {
  flex: 2; min-height: 0;
  display: flex;
  border-bottom: 1px solid var(--border);
}

/* C4-左 80%: 冲突对比 */
.c4-conflict {
  width: 80%; min-width: 0;
  overflow-y: auto; overflow-x: hidden;
  background: var(--surface);
  padding: 12px 16px;
}
.c4-conflict::-webkit-scrollbar { width: 4px; }
.c4-conflict::-webkit-scrollbar-track { background: transparent; }
.c4-conflict::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.c4c-placeholder {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--muted); gap: 10px;
}
.c4c-placeholder .c4c-ph-icon { font-size: 36px; opacity: 0.5; }
.c4c-placeholder .c4c-ph-text { font-size: 12px; letter-spacing: 0.5px; }

.c4c-header {
  font-size: 12px; font-weight: 600; color: var(--danger);
  margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
}
.c4c-header .c4c-gids { font-size: 10px; color: var(--muted); font-weight: 400; }

.c4c-table { width: 100%; border-collapse: collapse; font-size: 11px; }
.c4c-table th,.c4c-table td { padding: 6px 10px; text-align: center; border-bottom: 1px solid var(--border); }
.c4c-table th { font-weight: 500; color: var(--muted); font-size: 9px; letter-spacing: 0.5px; white-space: nowrap; }
.c4c-table th:first-child,.c4c-table td:first-child { text-align: left; }
.c4c-table td:first-child { font-weight: 500; color: var(--muted); font-size: 10px; }

/* C4-中 10%: 工作日看板 */
.c4-weekday-board {
  width: 10%; min-width: 100px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
  padding: 8px 6px;
}
.c4-weekday-board::-webkit-scrollbar { width: 3px; }
.c4-weekday-board::-webkit-scrollbar-track { background: transparent; }
.c4-weekday-board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.c4wb-title {
  font-size: 9px; font-weight: 600; color: var(--success);
  letter-spacing: 1px; text-align: center; margin-bottom: 8px;
  padding-bottom: 6px; border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.c4wb-item {
  padding: 5px 6px; margin-bottom: 4px;
  border-radius: var(--radius-sm);
  background: rgba(34,197,94,0.08);
  border: 1px solid rgba(34,197,94,0.2);

  font-size: 9px; line-height: 1.4;
}
.c4wb-item:hover { background: rgba(34,197,94,0.15); }
.c4wb-item .c4wb-time {
  color: var(--success); font-weight: 600; font-size: 10px;
}
.c4wb-item .c4wb-name {
  color: rgba(255,255,255,0.75); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.c4wb-item.highlight-active {
  border-color: var(--accent) !important;
  background: rgba(96,165,250,0.12) !important;
}
.c4wb-empty {
  color: var(--muted); font-size: 9px; text-align: center;
  padding: 20px 0; opacity: 0.6;
}

/* C4-右 10%: 气象限行 */
.c4-weather {
  width: 10%; min-width: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 10px 4px 8px; gap: 6px;
  overflow: hidden;
}
.c4w-label { font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; letter-spacing: 1px; }
.c4w-icon { font-size: 28px; line-height: 1; flex-shrink: 0; }
.c4w-desc { font-size: 10px; color: var(--text); font-weight: 500; white-space: nowrap; }
.c4w-temp { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.4; }
.c4w-divider { width: 60%; height: 1px; background: var(--border); flex-shrink: 0; }
.c4w-limit-label { font-size: 8px; color: var(--muted); letter-spacing: 1px; text-align: center; }
.c4w-limit-val { font-size: 14px; font-weight: 800; color: var(--danger); text-align: center; line-height: 1.2; white-space: nowrap; }
.c4w-nolimit { font-size: 12px; font-weight: 600; color: var(--success); text-align: center; white-space: nowrap; }

/* ── 甘特图区域 (下 33.3%) ── */
.gantt-area {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column;
  background: var(--surface);
  overflow: hidden;
}

.gantt-day-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 14px; flex-shrink: 0;

  font-size: 11px;
}
.gantt-day-header .gdh-label { font-weight: 600; color: var(--accent); }
.gantt-day-header .gdh-stats { font-size: 9px; color: var(--muted); }

.gantt-scroll {
  flex: 1; overflow-x: auto; overflow-y: hidden;
  scroll-behavior: smooth;
}
.gantt-scroll::-webkit-scrollbar { height: 4px; }
.gantt-scroll::-webkit-scrollbar-track { background: transparent; }
.gantt-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.gantt-container {
  display: flex; flex-direction: column;
  height: 100%; min-width: 100%;

}

/* ── C2/C3/C5 活动轨道 ── */
.gantt-tracks {
  flex: 1; min-height: 0;

}
.gantt-track {

}
#gantt-c5 .gantt-track-label {
  color: rgba(245,158,11,0.45); font-size: 9px;
}

/* ── 活动甘特块 ── */
.gantt-block {
  position: absolute; top: 2px; bottom: 2px;

.gantt-block:hover { filter: brightness(1.15); z-index: 5; }
.gantt-block.cold {
  background: linear-gradient(135deg, rgba(26,35,126,0.95) 0%, rgba(40,53,147,0.95) 100%);

}
.gantt-block.warm {

}
.gantt-block.neutral {

.gantt-block .gb-gid {

}
.gantt-block .gb-gid span {

.gantt-block .gb-content {

.gantt-block .gb-time {
  font-size: 13px; font-weight: 800; color: #fff;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-shadow: 0 1px 2px rgba(0,0,0,0.4); line-height: 1.1;

}
.gantt-block .gb-name {
  font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.92);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;

}
.gantt-block .gb-misc {

}

@keyframes conflict-pulse {

  animation: conflict-pulse 1.8s ease-in-out infinite;
}

/* ── C1 渐变时间轴 ── */
.gantt-axis {
  height: 30px; flex-shrink: 0;
  position: relative;
  background: linear-gradient(to right,
    #eab308 0%,
    #ef4444 25%,
    #3b82f6 62.5%,

}
.gantt-tick {
  position: absolute; top: 2px; font-size: 8px;

}
.gantt-tick-line {
  position: absolute; top: 16px; width: 1px; height: 14px;
  background: rgba(255,255,255,0.15);
}

  position: absolute; top: 0; width: 2px; height: 100%;

.empty-state {

/* Leaflet overrides */

.view-toggle {

   移动端响应式

</style>
</head>

<header class="header">
  <h1>🎯 周末交友战术指挥舱</h1>
  <span class="h-badge" id="h-week"></span>

        <div class="li"><span class="ld" style="background:transparent;border-bottom:2px dashed #60a5fa;width:16px;border-radius:0"></span>行车路线</div>

        <!-- 工作日看板 -->

<script>
// ================================================================
// 周末交友战术指挥舱 v7.6 — 地图容错 + 无效字段降噪 + 视觉聚焦
// ================================================================

// ===== 全局变量 =====
let allActivities = [];
let currentFilter = 'all';
let globalIdMap = {};
let mapMarkerMap = {};
let conflictIdSet = new Set();
let conflictMap = {};
let selectedActivityId = null;
let isMobileMode = false;

// ===== 常量 =====
const ORIGIN = { address: '北京市朝阳区南平里', lat: 39.98, lng: 116.48 };
const DAY_LABELS = { friday:'周五', saturday:'周六', sunday:'周日' };
const DAY_LABELS_FULL = { all:'全局 · 全部活动', friday:'周五 · 周末首日', saturday:'周六 · 周末核心', sunday:'周日 · 周末收官' };
const TONE_LABELS = { cold:'🔵 严肃', warm:'🟠 轻松', neutral:'⚪ 中性' };
const GANTT_START_HOUR = 8;
const GANTT_END_HOUR = 24;
const GANTT_TOTAL_MIN = (GANTT_END_HOUR - GANTT_START_HOUR) * 60;
// 蛇形轨道排列: C2 → C3 → C5 → C3 → C2
const GANTT_TRACK_ORDER = ['gantt-c2', 'gantt-c3', 'gantt-c5', 'gantt-c3', 'gantt-c2'];

// ===== Mock 气象限行 =====
const WEATHER_DATA = {
  friday:   { icon: '🌅', desc: '周五多云', temp: '18℃ ~ 28℃', limit: null, limitLabel: '周五不限行' },
  saturday: { icon: '⛅', desc: '周六多云转晴', temp: '20℃ ~ 32℃', limit: null, limitLabel: '周末不限行' },
  sunday:   { icon: '☀️', desc: '周日晴', temp: '21℃ ~ 33℃', limit: null, limitLabel: '周末不限行' },
  all:      { icon: '🗓️', desc: '本周天气', temp: '18℃ ~ 33℃', limit: null, limitLabel: '请选日期' },
};

// ===== 加载真实数据 =====
async function loadRealData() {
  try {
    const response = await fetch('./week_schedule.json?t=' + new Date().getTime());
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    allActivities = data.activities || data.items || [];

    console.log('[战术指挥舱] 数据加载成功，共 ' + allActivities.length + ' 条');
    console.log('[战术指挥舱] 时间分流:', data.meta?.date_categories || 'N/A');

    document.getElementById('h-week').textContent = '实时数据';
    document.getElementById('h-gen').textContent = '共 ' + allActivities.length + ' 场活动';

    buildGlobalIdMap();
    setupFilterTabs();
    applyFilter('all');

  } catch (e) {
    console.error('[战术指挥舱] 加载数据失败:', e);
    document.getElementById('h-gen').textContent = '数据加载失败';
    document.getElementById('gallery').innerHTML =
      '<div class="empty-state">⚠️ 数据加载失败<br><small>' + e.message + '</small><br>请确认 ./week_schedule.json 存在且格式正确</div>';
  }
}

// ===== 工具函数 =====
function timeToMin(isoStr) {
  if (!isoStr) return 0;
  const parts = isoStr.match(/T(\d{2}):(\d{2})/);
  if (!parts) return 0;
  return parseInt(parts[1]) * 60 + parseInt(parts[2]);
}

function minToPct(min) {
  return Math.max(0, Math.min(100, (min - GANTT_START_HOUR * 60) / GANTT_TOTAL_MIN * 100));
}

function parseActivityTimes(act) {
  const raw = act.activity_time || '';
  const match = raw.match(/(\d{1,2}):(\d{2})\s*[-~]\s*(\d{1,2}):(\d{2})/);
  if (match) {
    const h1 = match[1].padStart(2,'0'), m1 = match[2];
    const h2 = match[3].padStart(2,'0'), m2 = match[4];
    let dateStr = '2026-05-23';
    const dayRaw = raw.match(/(05月\d{1,2}日|05\.\d{1,2}|5月\d{1,2}日)/);
    if (dayRaw) {
      const d = dayRaw[0].match(/(\d{1,2})/);
      if (d) dateStr = '2026-05-' + d[1].padStart(2,'0');
    }
    return {
      start: dateStr + 'T' + h1 + ':' + m1 + ':00+08:00',
      end:   dateStr + 'T' + h2 + ':' + m2 + ':00+08:00'
    };
  }
  return { start: '', end: '' };
}

// ===== 时间分类：优先使用后端 date_category 字段（friday/saturday/sunday/weekday/next_week）=====
function getActivityDayKey(act) {
  const cat = act.date_category || 'unknown';
  // 新版后端输出：friday / saturday / sunday / weekday / next_week
  if (cat === 'friday') return 'friday';
  if (cat === 'saturday') return 'saturday';
  if (cat === 'sunday') return 'sunday';
  if (cat === 'weekday') return 'weekday';
  if (cat === 'next_week') return 'next_week';
  // 兼容旧版后端输出（weekend 笼统标签 → 从文本推断具体天）
  if (cat === 'weekend') {
    const raw = (act.activity_time || '') + ' ' + (act.activity_title || '');
    if (raw.includes('周五')) return 'friday';
    if (raw.includes('周六')) return 'saturday';
    if (raw.includes('周日')) return 'sunday';
    return 'friday'; // 无法判断，默认归周五
  }
  // fallback：从活动时间文本推断
  const raw = (act.activity_time || '') + ' ' + (act.activity_title || '');
  if (raw.includes('周五') || raw.match(/05月2[2-4]日/)) return 'friday';
  if (raw.includes('周六') || raw.match(/05月2[3-5]日/)) return 'saturday';
  if (raw.includes('周日') || raw.match(/05月2[4-6]日/)) return 'sunday';
  if (raw.includes('05月30日') || raw.includes('下周')) return 'next_week';
  return 'unknown';
}

function getActivityDayLabel(cat) {
  const map = {
    friday: '周五', saturday: '周六', sunday: '周日',
    weekday: '工作日', next_week: '下周', weekend: '本周末',
    unknown: '未知'
  };
  return map[cat] || cat;
}

// ===== 筛选：next_week 和 weekday 只在 All 中显示，周五/六/日独立面板各自精确匹配 =====
function getActivitiesByDay(filter) {
  if (filter === 'all') {
    // All 模式：显示全部活动
    return allActivities;
  }
  // 精确匹配：非 All 模式只返回完全匹配的日期类别
  return allActivities.filter(act => {
    const dk = getActivityDayKey(act);
    // 硬守卫：非 all 模式下绝对排除 next_week 和 weekday
    if (dk === 'next_week' || dk === 'weekday') return false;
    return dk === filter;
  });
}

function getActivityCountByDay(dayKey) {
  return allActivities.filter(act => getActivityDayKey(act) === dayKey).length;
}

function getActivitiesForDateCat(cat) {
  return allActivities.filter(act => getActivityDayKey(act) === cat);
}

// ===== build index =====
function buildGlobalIdMap() {
  globalIdMap = {};
  conflictIdSet = new Set();
  conflictMap = {};
  allActivities.forEach(act => {
    const gid = parseInt((act.global_id || '0').replace(/\D/g,'')) || 0;
    if (gid > 0) {
      globalIdMap[gid] = { activity: act, dayKey: getActivityDayKey(act) };
    }
  });
  // 冲突检测
  const byDay = {};
  allActivities.forEach(act => {
    const dk = getActivityDayKey(act);
    if (!byDay[dk]) byDay[dk] = [];
    byDay[dk].push(act);
  });
  Object.keys(byDay).forEach(dk => {
    const list = byDay[dk];
    for (let i = 0; i < list.length; i++) {
      for (let j = i+1; j < list.length; j++) {
        const a = parseActivityTimes(list[i]);
        const b = parseActivityTimes(list[j]);
        if (a.start && b.start && a.end && b.end) {
          const as = new Date(a.start).getTime(), ae = new Date(a.end).getTime();
          const bs = new Date(b.start).getTime(), be = new Date(b.end).getTime();
          if (as < be && bs < ae) {
            const idA = list[i].global_id || ('ACT-'+i);
            const idB = list[j].global_id || ('ACT-'+j);
            conflictIdSet.add(idA);
            conflictIdSet.add(idB);
            if (!conflictMap[idA]) conflictMap[idA] = { members: [] };
            if (!conflictMap[idB]) conflictMap[idB] = { members: [] };
          }
        }
      }
    }
  });
}

// ===== 统计通栏 =====
function renderStatsRibbon(filter) {
  const all = getActivitiesByDay(filter);
  const totalEvents = all.length;
  const totalBudget = all.reduce((s,a) => s + (parseInt((a.cost||'0').replace(/[^\d]/g,''))||0), 0);
  const total = all.length || 1;

  // 统计时间分类
  const nwCount = filter === 'all' ? getActivitiesForDateCat('next_week').length : 0;
  const wdCount = filter === 'all' ? getActivitiesForDateCat('weekday').length : 0;

  let extraStats = '';
  if (filter === 'all' && (nwCount > 0 || wdCount > 0)) {
    let parts = [];
    if (wdCount > 0) parts.push('<span style="color:#22c55e;font-size:9px;">🟢 工作日 ' + wdCount + '场</span>');
    if (nwCount > 0) parts.push('<span style="color:#60a5fa;font-size:9px;">🔵 下周 ' + nwCount + '场</span>');

  document.getElementById('stats-ribbon').innerHTML = `

    <div class="sr-divider"></div>

// ===== A区 Gallery 渲染 =====
function renderGallery(filter) {
  const acts = getActivitiesByDay(filter);
  const container = document.getElementById('gallery');
  if (!acts.length) { container.innerHTML = '<div class="empty-state">📭 暂无活动</div>'; return; }

  if (filter !== 'all') {
    container.classList.add('single-col');
  } else {
    container.classList.remove('single-col');
  }

  container.innerHTML = acts.map(a => renderPosterCard(a)).join('');

  container.querySelectorAll('.poster-card').forEach(card => {
    card.addEventListener('click', function() {
      const gid = parseInt(this.dataset.globalId);
      const aid = this.dataset.activityId;
      selectedActivityId = aid;
      if (currentFilter !== 'all') {
        const info = globalIdMap[gid];
        if (info) renderDetailPanel(info.activity);
        container.querySelectorAll('.poster-card').forEach(c => c.classList.remove('selected'));
        this.classList.add('selected');
      }
      highlightByGlobalId(gid);
      if (conflictIdSet.has(aid)) {
        renderC4Conflict(conflictMap[aid]);
      } else {
        renderC4Conflict(null);
      }
    });
    card.addEventListener('mouseenter', function() {
      softHighlightByGlobalId(parseInt(this.dataset.globalId));
    });
    card.addEventListener('mouseleave', clearHighlights);
  });
}

function renderPosterCard(a) {
  const gid = a.global_id || '?';
  const gidNum = parseInt(gid.replace(/\D/g,'')) || 0;
  const times = parseActivityTimes(a);
  const timeStr = times.start ? times.start.slice(11,16) + ' ~ ' + times.end.slice(11,16) : '时间待定';
  const dk = getActivityDayKey(a);
  const tone = (a.activity_type||[]).some(t => t.includes('派对') || t.includes('酒会')) ? 'warm' : 'cold';
  const feeNum = parseInt((a.cost||'0').replace(/[^\d]/g,'')) || 0;
  const capNum = parseInt((a.capacity||'0').replace(/[^\d]/g,'')) || 0;
  const hasImage = a.source_type === 'img' && a.source_url && a.source_url.startsWith('http');

  // 颜色区分
  let cardClass = 'poster-card';
  let toneClass = 'tone-' + tone;
  let toneLabel = TONE_LABELS[tone] || tone;
  if (dk === 'next_week') {
    cardClass += ' next-week';
    toneClass = 'tone-next';
    toneLabel = '🔵 下周';
  } else if (dk === 'weekday') {
    cardClass += ' weekday';
    toneClass = 'tone-wkd';
    toneLabel = '🟢 工作日';
  }

  let bgStyle = '';
  if (hasImage) {
    bgStyle = `background-image:url(${a.source_url});background-size:cover;background-position:center;`;
  } else {
    const gradients = {
      cold:   'linear-gradient(160deg, #0f172a 0%, #1e3a5f 40%, #1a237e 100%)',
      warm:   'linear-gradient(160deg, #431407 0%, #92400e 40%, #b45309 100%)',
      neutral:'linear-gradient(160deg, #1c1917 0%, #374151 40%, #1e293b 100%)',
    };
    bgStyle = `background:${gradients[tone]||gradients.neutral};`;
  }

  const title = (a.activity_title||a.title||'未命名活动').substring(0,30);
  const loc = (a.activity_location||'—').substring(0,20);
  const costRaw = (a.cost || '').trim();
  const isCostDimmed = costRaw === '详见详情' || costRaw === '未知';
  const isLocDimmed = (a.activity_location || '').includes('待定');
  const costDisplay = isCostDimmed ? costRaw : `¥${feeNum || '免费'}`;
  const dateCatLabel = dk === 'weekday' ? '📅工作日' : (dk === 'next_week' ? '📅下周' : (dk === 'friday' ? '📅周五' : (dk === 'saturday' ? '📅周六' : (dk === 'sunday' ? '📅周日' : ''))));
  const organizerStr = a.organizer ? ' | ' + a.organizer : '';

  return `
  <div class="${cardClass}" data-activity-id="${gid}" data-global-id="${gidNum}">
    ${hasImage ? `<div class="poster-bg" style="${bgStyle}"></div>` : ''}
    <div class="poster-overlay"></div>
    <div class="global-id-badge"><span class="gid-num">${gidNum||'?'}</span></div>
    <span class="poster-tone ${toneClass}">${toneLabel}</span>
    <div class="poster-content">
      <div class="poster-name">${dateCatLabel ? '<span style="font-size:9px;opacity:0.7;">'+dateCatLabel+'</span> ' : ''}${title}</div>
      <div class="poster-meta">
        <div class="pm-item"><span class="pm-lbl">时间</span><span class="pm-val">${timeStr}</span></div>
        <div class="pm-item"><span class="pm-lbl">费用</span><span class="pm-val${isCostDimmed ? ' pm-dimmed' : ''}">${costDisplay}</span></div>
        <div class="pm-item"><span class="pm-lbl">人数</span><span class="pm-val">${capNum||'—'}人</span></div>
        <div class="pm-item" style="grid-column:1/-1"><span class="pm-lbl">📍</span><span class="pm-val${isLocDimmed ? ' pm-dimmed' : ''}">${loc}${organizerStr}</span></div>
      </div>
      ${(a.activity_type||[]).length ? `<div class="poster-details"><div class="poster-detail-row"><span class="poster-detail-icon">🎪</span><span class="poster-detail-text">${(a.activity_type||[]).join('/')}</span></div></div>` : ''}
      ${(a.summary||'') ? `<div class="poster-essence">${(a.summary||'').substring(0,60)}</div>` : ''}
      <div class="poster-footer">
        ${a.source_url ? `<a class="poster-link" href="${a.source_url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📎 原始链接</a>` : `<span class="poster-link" style="color:var(--muted);cursor:default;opacity:0.4;">📎 无链接</span>`}
        <span class="poster-score mid">⭐ 待评分</span>
      </div>
    </div>
  </div>`;
}

  return L.divIcon({
    className: 'map-marker-icon',
    html: `<div style="background:#3b82f6;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid rgba(255,255,255,0.85);box-shadow:0 2px 10px rgba(59,130,246,0.6);color:#fff;font-weight:800;font-size:11px;">${gidNum}</div>`,
    iconSize: [26,26], iconAnchor: [13,13], popupAnchor: [0,-14]
  });
}

function renderMap(filter) {
  clearMap();
  const activities = getActivitiesByDay(filter || 'all');
  if (!activities.length) { fitMap([]); return; }

  const R = 0.05;
  activities.forEach(act => {
    // 🔥 地点待定 → 跳过地图标记，保持地图视野战术纯净
    const locVal = act.activity_location || '';
    if (locVal.includes('待定')) return;

    const gidNum = parseInt((act.global_id||'0').replace(/\D/g,'')) || 0;
    const angle = (gidNum * 137.5) % 360 * Math.PI / 180;
    const radius = ((gidNum * 7) % 100) / 100 * R;
    const lat = ORIGIN.lat + Math.cos(angle) * radius;
    const lng = ORIGIN.lng + Math.sin(angle) * radius;

    const icon = createFuzzyMarkerIcon(gidNum);
    const mk = L.marker([lat, lng], { icon }).bindPopup(buildPopup(act));
    mk._gid = gidNum;
    mk.on('click', () => { highlightByGlobalId(gidNum); });
    markersLayer.addLayer(mk);
    mapMarkerMap[gidNum] = mk;
  });
  fitMap(activities);
}

// ================================================================
//   C区: C4 面板 + C4 工作日看板 + 甘特图 C2/C3/C5
// ================================================================

/* ── C4 冲突对比 ── */
function renderC4Conflict(cg) {
  const el = document.getElementById('c4-conflict');
  if (!cg) {
    el.innerHTML = `
      <div class="c4c-placeholder">
        <div class="c4c-ph-icon">⚡</div>
        <div class="c4c-ph-text">当前未检测到战术冲突</div>
      </div>`;
    return;
  }
  el.innerHTML = '<div class="c4c-placeholder"><div class="c4c-ph-icon">⚡</div><div class="c4c-ph-text">冲突数据格式待适配</div></div>';
}

/* ── C4 气象限行 ── */
function renderC4Weather(filter) {
  const w = WEATHER_DATA[filter] || WEATHER_DATA.all;
  const el = document.getElementById('c4-weather');
  const dayLabel = filter === 'all' ? '全局' : (DAY_LABELS[filter] || '');
  let limitHtml = '';
  if (w.limit) {
    limitHtml = `<div class="c4w-divider"></div>
      <div class="c4w-limit-label">${w.limitLabel}</div>
      <div class="c4w-limit-val">${w.limit}</div>`;
  } else {
    limitHtml = `<div class="c4w-divider"></div>
      <div class="c4w-limit-label">${w.limitLabel}</div>
      <div class="c4w-nolimit">不限行</div>`;
  }
  el.innerHTML = `
    <div class="c4w-label">${dayLabel}</div>
    <div class="c4w-icon">${w.icon}</div>
    <div class="c4w-desc">${w.desc}</div>
    <div class="c4w-temp">${w.temp.replace(' ~ ', '<br>')}</div>
    ${limitHtml}
  `;
}

/* ── C4 工作日看板 ── */
function renderC4WeekdayBoard() {
  const board = document.getElementById('c4-weekday-board');
  // 仅渲染 weekday（工作日）活动，next_week（下周）不在其中
  const wdActs = getActivitiesForDateCat('weekday');

  // 移除旧项目
  board.querySelectorAll('.c4wb-item').forEach(el => el.remove());
  const emptyEl = document.getElementById('c4wb-empty');
  if (emptyEl) emptyEl.style.display = wdActs.length ? 'none' : 'block';

  if (!wdActs.length) return;

  wdActs.forEach(act => {
    const gidNum = parseInt((act.global_id||'0').replace(/\D/g,'')) || 0;
    const times = parseActivityTimes(act);
    const timeStr = times.start ? times.start.slice(11,16) : '—';
    const name = (act.activity_title||act.title||'').substring(0,16);

    const item = document.createElement('div');
    item.className = 'c4wb-item';
    item.dataset.globalId = gidNum;
    item.innerHTML = `
      <div class="c4wb-time">${timeStr} 🟢</div>
      <div class="c4wb-name">${name}</div>
    `;
    item.addEventListener('click', function() {
      const gid = parseInt(this.dataset.globalId);
      highlightByGlobalId(gid);
    });
    item.addEventListener('mouseenter', function() {
      softHighlightByGlobalId(parseInt(this.dataset.globalId));
    });
    item.addEventListener('mouseleave', clearHighlights);
    board.appendChild(item);
  });
}

/* ── 甘特图 C1/C2/C3/C5（蛇形排列）── */
function renderGanttChart(filter) {
  const activities = getActivitiesByDay(filter || 'all');
  const c2Track = document.getElementById('gantt-c2');
  const c3Track = document.getElementById('gantt-c3');
  const c5Track = document.getElementById('gantt-c5');
  const axisEl = document.getElementById('gantt-axis');

  [c2Track, c3Track, c5Track].forEach(t => {
    t.querySelectorAll('.gantt-block').forEach(el => el.remove());
  });
  axisEl.innerHTML = '';

  // C1 时间轴刻度
  for (let h = GANTT_START_HOUR; h <= GANTT_END_HOUR; h++) {
    const pct = minToPct(h * 60);
    const tick = document.createElement('div');
    tick.className = 'gantt-tick';
    tick.style.left = pct + '%';
    tick.style.transform = 'translateX(-50%)';
    tick.textContent = h.toString().padStart(2,'0') + ':00';
    axisEl.appendChild(tick);
    const line = document.createElement('div');
    line.className = 'gantt-tick-line';
    line.style.left = pct + '%';
    axisEl.appendChild(line);
  }

  // 现在时刻线
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const nowPct = minToPct(nowMin);
  if (nowPct >= 0 && nowPct <= 100) {
    const nowLine = document.createElement('div');
    nowLine.className = 'gantt-now-line';
    nowLine.style.left = nowPct + '%';
    axisEl.appendChild(nowLine);
  }

  if (!activities.length) {
    c2Track.innerHTML = '<div class="empty-state" style="position:absolute;inset:0;display:flex;">📭 该筛选条件下无活动</div>';
    return;
  }

  // 蛇形轨道分配（时间感知）：C2 → C3 → C5 蛇形排列，同轨杜绝时间重叠
  const SNAKE_ORDER = ['gantt-c2', 'gantt-c3', 'gantt-c5', 'gantt-c3', 'gantt-c2'];
  const trackAssignments = { 'gantt-c2': [], 'gantt-c3': [], 'gantt-c5': [] };

  activities.forEach((act, idx) => {
    const times = parseActivityTimes(act);
    const sMin = times.start ? timeToMin(times.start) : GANTT_START_HOUR * 60;
    const eMin = times.end ? timeToMin(times.end) : GANTT_START_HOUR * 60 + 60;

    let assigned = false;
    for (const tid of SNAKE_ORDER) {
      const hasOverlap = trackAssignments[tid].some(existing => {
        return sMin < existing.eMin && eMin > existing.sMin;
      });
      if (!hasOverlap) {
        trackAssignments[tid].push({ act, idx, sMin, eMin });
        assigned = true;
        break;
      }
    }
    // 所有轨道都冲突时，强制放入 C5（容错降级）
    if (!assigned) {
      trackAssignments['gantt-c5'].push({ act, idx, sMin, eMin });
    }
  });

  // 渲染所有轨道
  const trackElMap = { 'gantt-c2': c2Track, 'gantt-c3': c3Track, 'gantt-c5': c5Track };

  Object.keys(trackAssignments).forEach(trackId => {
    const trackEl = trackElMap[trackId];
    if (!trackEl) return;

    trackAssignments[trackId].forEach(({ act, idx, sMin, eMin }) => {
      const gidNum = parseInt((act.global_id||'0').replace(/\D/g,'')) || 0;
      const tone = (act.activity_type||[]).some(t => t.includes('派对') || t.includes('酒会')) ? 'warm' : 'cold';
      const times = parseActivityTimes(act);

      // 使用预计算的 sMin/eMin（已通过时间感知蛇形分配）
      const cs = Math.max(sMin, GANTT_START_HOUR * 60);
      const ce = Math.min(eMin, GANTT_END_HOUR * 60);
      const leftPct = minToPct(cs);
      const widthPct = Math.max(3, minToPct(ce) - leftPct);

      const block = document.createElement('div');
      block.className = `gantt-block ${tone}`;
      block.dataset.globalId = gidNum;
      block.dataset.activityId = act.global_id || '';
      block.style.left = leftPct + '%';
      block.style.width = widthPct + '%';

      const timeStr = times.start ? times.start.slice(11,16)+'-'+times.end.slice(11,16) : '??:??';
      const miscStr = `${(act.organizer||'—')} | ¥${(act.cost||'—')} | ${(act.capacity||'—')}人`;
      block.title = `#${gidNum} ${(act.activity_title||act.title||'').substring(0,20)}\n${timeStr}\n${miscStr}`;

      block.innerHTML = `
        <span class="gb-gid"><span>${gidNum||'?'}</span></span>
        <div class="gb-content">
          <span class="gb-time">${timeStr}</span>
          <span class="gb-name">${(act.activity_title||act.title||'').substring(0,18)}</span>
          <span class="gb-misc">${miscStr.substring(0,30)}</span>
        </div>
      `;

      block.addEventListener('click', function(e) {
        e.stopPropagation();
        const gidInt = parseInt(this.dataset.globalId);
        highlightByGlobalId(gidInt);
        if (currentFilter !== 'all') {
          const info = globalIdMap[gidInt];
          if (info) {
            renderDetailPanel(info.activity);
            selectedActivityId = act.global_id;
            document.querySelectorAll('.poster-card.selected').forEach(c=>c.classList.remove('selected'));
            const card = document.querySelector(`.poster-card[data-global-id="${gidInt}"]`);
            if (card) card.classList.add('selected');
          }
        }
      });
      block.addEventListener('mouseenter', function() {
        softHighlightByGlobalId(parseInt(this.dataset.globalId));
      });
      block.addEventListener('mouseleave', clearHighlights);

      trackEl.appendChild(block);
    });
  });
}

// ================================================================
//   三区联动：高亮
// ================================================================

function highlightByGlobalId(gid) {
  clearHighlights();
  if (!gid || !globalIdMap[gid]) return;
  const info = globalIdMap[gid];

  const posterCard = document.querySelector(`.poster-card[data-global-id="${gid}"]`);
  if (posterCard) {
    posterCard.classList.add('highlight-active');
    posterCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  const mk = mapMarkerMap[gid];
  if (mk && info.activity) {
    map.flyTo(mk.getLatLng(), 14, { duration: 0.8 });
    setTimeout(() => { mk.openPopup(); }, 900);
    const iconEl = mk.getElement();
    if (iconEl) iconEl.classList.add('map-marker-highlight');
    mk._highlighted = true;
  }

  // 甘特块 + 工作日看板项目
  document.querySelectorAll(`.gantt-block[data-global-id="${gid}"], .c4wb-item[data-global-id="${gid}"]`)
    .forEach(el => {
      el.classList.add('highlight-active');
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    });
}

function softHighlightByGlobalId(gid) {
  if (!gid || !globalIdMap[gid]) return;
  const posterCard = document.querySelector(`.poster-card[data-global-id="${gid}"]`);
  if (posterCard) posterCard.classList.add('highlight-active');
  document.querySelectorAll(`.gantt-block[data-global-id="${gid}"], .c4wb-item[data-global-id="${gid}"]`)
    .forEach(el => el.classList.add('highlight-active'));
  const mk = mapMarkerMap[gid];
  if (mk) {
    const iconEl = mk.getElement();
    if (iconEl) iconEl.classList.add('map-marker-highlight');
    mk._highlighted = true;
  }
}

function clearHighlights() {
  document.querySelectorAll('.highlight-active').forEach(el => el.classList.remove('highlight-active'));
  Object.values(mapMarkerMap).forEach(mk => {
    if (mk._highlighted) {
      const iconEl = mk.getElement();
      if (iconEl) iconEl.classList.remove('map-marker-highlight');
      mk._highlighted = false;
    }
  });
}

document.addEventListener('click', function(e) {
  if (!e.target.closest('.poster-card') && !e.target.closest('.gantt-block') && !e.target.closest('.leaflet-marker-icon') && !e.target.closest('.c4wb-item')) {
    setTimeout(clearHighlights, 100);
  }
});

// ===== 初始化 =====
function init() {
  setupViewToggle();
  setTimeout(() => map.invalidateSize(), 200);
  loadRealData();
}

document.addEventListener('DOMContentLoaded', init);
window.addEventListener('resize', () => {
  setTimeout(() => {
    map.invalidateSize();
    if (window.innerWidth < 768) {
      document.body.style.overflowY = 'auto';
    } else if (!isMobileMode) {
      document.body.style.overflowY = '';
    }
  }, 200);
});
</script>
